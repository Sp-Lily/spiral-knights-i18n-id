r.sprite_tut_4c = Aku punya pertanyaan lain.
r.sprite_tut_4cc = Cukup sampai di sini untuk sekarang, terima kasih!

m.sprite_tut_2d = Sprite Tempur memperoleh keistimewaan pada level tertentu yang dapat kamu pasang melalui \
