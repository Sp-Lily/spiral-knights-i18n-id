## CORE RESEARCH

# Vaelyn
#...................................................................................................

#n.core_lead = Vaelyn
n.parmas_scout = Pengintai Parma

m.core_lead_1 = Salam. Aku Letnan Vaelyn, perwira komandan penelitian Inti di lokasi ini. Kamu \
	jelas termasuk salah satu Spiral Knight terkuat hingga mampu mencapai kedalaman neraka ini, tetapi \
	kekuatan saja tidak akan membawamu lebih jauh.

r.core_lead_1 = Bagaimana situasinya, Letnan?

m.core_lead_2 = Kami sedang berusaha menemukan cara untuk mengaktifkan Inti melalui kekuatan \
	mineral yang ditemukan di dalam Clockworks. Mineral-mineral itu mampu mengubah \
	Clockworks- kami telah melihatnya di Arena Haven. Kami yakin dapat menggunakan \
	kekuatan itu untuk mengaktifkan Inti dan... entah bagaimana membukanya.

r.core_lead_2 = Kamu ingin membukanya?

m.core_lead_3 = Ya, Kapten Ozlo sendiri telah memerintahkan kami untuk bertahan selama mungkin \
	dan mempelajari apa pun yang bisa kami temukan. Jika kita berhasil meninggalkan planet ini, itu akan berkat \
	Inti ini.  \n\
	\n\
	Aku yakin bahwa selain berpotensi menjadi sumber energi, Inti ini juga merupakan semacam pusat saraf \
	bagi segala sesuatu yang kamu lihat di dalam Clockworks. Kamu bisa merasakannya dari sedikit udara yang ada \
	di sini; ada perasaan liar dan mengancam bahwa ini bukan sekadar mesin biasa.

r.core_lead_3 = Maksudmu... benda itu hidup?

m.core_lead_4 = Maksudku, kita tahu bahwa seluruh dunia ini bukanlah sesuatu yang alami, dan aku sendiri tidak \
	percaya bahwa gerombolan gremlin menyedihkan itu, sehebat apa pun mereka dalam bekerja, mampu membangun \
	seluruh dunia. Mereka pasti dibantu oleh sesuatu yang jauh melampaui kemampuan mereka, dan \
	mungkin apa pun itu berada di dalam Inti. \n\
	\n\
	Begitu juga dengan Skuad Alfa. Mereka tidak mungkin menghilang begitu saja, bahkan di kedalaman \
	Clockworks yang paling jauh sekalipun. Mereka adalah yang terbaik yang kita miliki. Inti inilah yang menelan mereka.

r.core_lead_4 = Tapi kupikir tidak ada cara untuk masuk ke dalamnya?

m.core_lead_5 = Aku tidak tahu bagaimana caranya, tetapi mereka pasti akan menemukan jalan. Mereka pasti sudah... dan sekarang \
	mereka telah tiada.

r.core_lead_5 = Akhiri percakapan


