	menghasilkan kerusakan tembusan. \n\
	\n\
	Secara default, kamu memiliki tali pengendali besi yang dapat digunakan oleh Sprite mana pun. Jika kamu ingin memiliki lebih banyak pilihan, \
	seperti halnya senjata dan perlengkapanmu, kamu perlu membeli tali pengendali baru.

