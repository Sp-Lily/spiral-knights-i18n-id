m.hunter_1a = Salam, Knight yang budiman, aku Armero, pemburu ulung dari alam liar sekaligus pengelola \
	pondok bergengsi yang ada di hadapanmu ini. \n\
	\n\
	Di dinding tergantung berbagai trofi yang diperoleh dari ekspedisi penuh keberanian, tempat \
	nyawa dan anggota tubuh dipertaruhkan demi merasakan sensasi perburuan yang murni dan tak \
	terjinakkan. \n\
	\n\
