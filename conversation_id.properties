  untuk memecahnya menjadi ukuran yang bisa kamu bawa. Kamu hanya bisa mengambil satu \
  sekaligus, tetapi kamu bisa menukarnya dengan mengambil \
  yang lain. Carilah yang terbesar dan paling berkilau. Mineral tersebut paling berharga.

r.arc_mintut_3 = Lanjutkan

m.arc_mintut_4 = Setelah kamu berhasil mencapai lift dengan selamat, mineral yang kamu bawa akan disimpan di \
  persenjataan-mu untuk digunakan nanti. Semua anggota grup mendapatkan mineral milik satu sama lain, jadi tidak perlu \
  berebut untuk mendapatkan mineral terbaik!

r.arc_mintut_4 = Lanjutkan

m.arc_mintut_5 = Mineral digunakan untuk membuat makanan Sprite di Laboratorium. Makanan Sprite sangat \
  penting bagi perkembangan Sprite-mu, jadi ambillah mineral itu saat kamu melihatnya!

r.arc_mintut_5 = Lanjutkan

m.arc_mintut_6 = Penelitian geologi kami masih berlangsung, jadi mungkin masih ada kegunaan menarik lainnya \
