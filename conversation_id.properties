# Dark Harvest Festival
#...................................................................................................

#n.dark_harvest_exp = Muerty

m.dark_harvest_exp = Selamat datang di Festival Panen Kegelapan! Perayaan tahunan ini menghormati para \
	mayat hidup dengan topeng meriah, camilan lezat, dan trik berbahaya!\n\
	\n\
	Untuk berpartisipasi, jelajahi Clockworks dan cobalah menemukan 'Raja Labu' yang legendaris. Labu \
	seram ini membagikan permen kepada para pengunjung. Kamu bisa menukarkan permen itu kepada para pedagang \
	di Alun-Alun Kota Haven untuk mendapatkan topeng monster!\n\
	\n\
	Jika kamu lebih suka cara langsung, atau hanya membutuhkan beberapa permen lagi, pedagang kami juga \
	menjual permen.

r.dark_harvest_exp = Kedengarannya menyenangkan! Aku akan pergi mencari Raja Labu!


# Winterfest
#...................................................................................................

#n.impostoclaus = Impostoclaus

m.impostoclaus = Glorp, glorp, glorp! Selamat Winterfest!\n\
	\n\
	Rasakan semangat liburan dengan perang bola salju di level Penguasaan Wilayah bersalju dan tukarkan Koin Krogmo \
	untuk mendapatkan Topi Santy yang indah!

r.impostoclaus = Aku percaya padamu, Impostoclaus!

m.impostoclaus_1a= Glorp! Glorp! Glorp! Selamat Winterfest!\n\
	\n\
	Waktu istimewa dalam setahun itu akhirnya tiba, saat selimut salju putih yang menakjubkan menutupi \
	Haven dan setiap Stranger, setiap snipe, serta setiap Knight memenuhi hati mereka dengan keceriaan liburan.\n\
	\n\
	Namun, harus kuberitahukan kepadamu bahwa keadaan ternyata tidak baik-baik saja. Tanpa alasan yang jelas, \
	sekelompok grinchlin berhati kerdil telah mengancam perayaan Winterfest kali ini!
r.impostoclaus_1a = Tidak selama aku masih ada! Aku akan menyelamatkan Winterfest! Bagaimana aku bisa membantu?

m.impostoclaus_2a = Sungguh berani, sungguh tangguh! Ya, mungkin dengan sedikit keberuntungan, kamu punya peluang \
	menghadapi para iblis mengerikan yang berniat menghancurkan impian Winterfest. \n\
	\n\
	Jadi, perhatikan misi Winterfest yang baru ditambahkan, angkat pedangmu, dan aku akan memberimu hadiah!
r.impostoclaus_2a = Selesaikan misi 'Selamatkan Winterfest!' dan dapatkan hadiah Winterfest spesial? Aku siap melakukannya!

m.impostoclaus_3a = Glorp! Glorp! Glorp!
r.impostoclaus_3a = Lihat toko hadiah Winterfest
r.impostoclaus_3b = Akhiri percakapan

m.impostoclaus_win = Glorp! Glorp! Winterfest berhasil diselamatkan dan satu hal sudah jelas: kini semua hati bernyanyi penuh keceriaan liburan!
m.impostoclaus_fail = Misi kita untuk menyelamatkan Winterfest berakhir dengan kekalahan! Grinchlin telah menang, kita harus mundur!

