m.core_tech_2 = Mudah saja, terus kumpulkan mineral di dalam Clockworks dan gunakan untuk memberi daya pada \
	gerbang-gerbang di dalam arena. Kami perlu menganalisis bagaimana kekuatan mineral memengaruhi Inti. Masalahnya, \
	hanya sedikit daya yang mencapai kedalaman ini. Kami hanya bisa mengumpulkan begitu banyak data dari \
	setiap gerbang saat gerbang itu diaktifkan.

