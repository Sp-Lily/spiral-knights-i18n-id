	Keahlian tempur menjadi lebih kuat dengan poin keahlian.

r.sprite_tut_3b = Lanjutkan

m.sprite_tut_4b = Poin keahlian diperoleh secara berkala saat Sprite naik level. Poin ini dapat diterapkan pada \
	keahlian melalui antarmuka Sprite Tempur. \n\
	\n\
	Saat menerapkan poin keahlian, kamu harus memilih aspek yang ingin ditingkatkan, seperti tingkat \
	cooldown atau total kerusakan.

r.sprite_tut_4b = Lanjutkan

