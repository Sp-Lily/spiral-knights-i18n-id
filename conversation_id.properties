	\n\
	Dengan semua pilihan ini, Sprite-mu yang telah mencapai level maksimum pasti akan terlihat dan berperilaku berbeda dari \
	Sprite lainnya!

r.sprite_tut_7b = Aku punya pertanyaan lain.
r.sprite_tut_7bb = Cukup sampai di sini untuk sekarang, terima kasih!

m.sprite_tut_2c = Semua Sprite Tempur mengenakan tali pengendali mekanis yang menyelaraskan keahlian mereka dengan \
