# Court Sprite 1
#...................................................................................................

n.fc_sprite = Sprite

m.fc_court_1 = Kamu... kamu bukan salah satu dari mereka yang tersesat. Kamu pasti kuat hingga bisa sampai ke halaman ini. \
  Kumohon, kamu harus membantuku!

r.fc_court_1 = Siapa yang akan kubantu?

m.fc_court_2 = Aku adalah Sprite, kekuatan alam yang dipanggil ke alam ini untuk memadamkan \
  api tak alami yang sedang melahapnya. Namun Vanaduke menemukan dan memenjarakan kami. Aku berhasil melarikan diri, \
  tetapi Sprite lainnya masih berada dalam tahanannya.\n\
  \n\
  Kini tak seorang pun dapat melewati halaman ini karena pilar api bayangan menghalangi semua jalan keluar. Api bayangan \
  hanya dapat dipadamkan dengan air yang mengalir dari sumur roh ini. Air ini adalah air \
  paling murni di seluruh alam, mengalir langsung dari mata air di dalam alam milik \
  Sang Ibu Roh sendiri.

r.fc_court_2 = Sumur-sumur itu tampak kering...

m.fc_court_3 = Tanpa kekuatan Sprite lainnya, air tidak akan pernah mengalir melalui alam \
  ini. Diperlukan hubungan Fokus dengan Sang Ibu Roh agar setetes air saja dapat mengalir \
  ke dunia yang begitu menindas ini. Penguasa alam ini telah memastikan bahwa \
  api yang mengelilinginya akan selalu menyala.

r.fc_court_3 = Aku akan membebaskan para Sprite!

m.fc_court_4 = Kalau begitu, kamu juga pemberani, pengembara. Kamu dapat menemukan kerabatku di seluruh \
  halaman ini. Namun berhati-hatilah, karena para minion mengerikan milik Vanaduke menjaga \
  mereka. Banyak yang berpatroli di jalan utama, jadi awaslah saat kamu berkeliling.\n\
  \n\
  Setelah menemukan seorang Sprite, bawa dia kembali ke lingkaran suci yang ada di hadapanmu. Mereka \
  pasti telah dilemahkan oleh kutukan Vanaduke dan perlu dipulihkan. Setelah enam Sprite lainnya \
  berkumpul kembali, kami akan membentuk hubungan Fokus dengan Sang Ibu Roh dan mengalirkan air ke sumur-sumur.

r.fc_court_4_accept = Bebaskan 6 Sprite yang Tersesat? Aku bisa melakukannya!
r.fc_court_4 = Aku akan segera kembali.

m.fc_court_5 = Semoga Sang Ibu Roh membimbingmu.

r.fc_court_5 = Akhiri percakapan


