## GENERAL

m.please_wait = Harap Tunggu

# Energy Info
#...................................................................................................

n.energy_info = Knight Energik

m.energy_info_1a = Tahukah kamu apa sumber daya terpenting di Cradle? ENERGI! Benar sekali! \
	Temanku, sesuatu yang begitu istimewa hingga layak diteriakkan! Ingin tahu tentang hal yang \
	sangat penting ini? Kebetulan aku ahli dalam bidang ini!

r.energy_info_1a = Sepertinya aku memang harus tahu tentang ini. Ceritakan lebih banyak!

r.energy_info_1b = Tidak, terima kasih. Aku lebih suka tidak tahu tentang sesuatu yang sehebat itu.

m.energy_info_2a = Hebat! Akan kujelaskan dalam tiga pelajaran sederhana: apa itu energi, bagaimana \
	energi digunakan, dan bagaimana kamu bisa mendapatkannya lebih banyak.

r.energy_info_2a = Apa itu energi?

r.energy_info_2b = Bagaimana energi digunakan?

r.energy_info_2c = Bagaimana cara mendapatkan lebih banyak energi?

r.energy_info_2d = Pelajaranmu membuatku bersemangat! Aku pergi bertualang dulu, sampai jumpa!

m.energy_info_3a = Energi adalah kekuatan istimewa yang terus memancar dari inti dunia ini. \
	Energi sangat stabil dan tidak akan hilang kecuali diperdagangkan atau digunakan. \
	(Kamu bisa melihat jumlah energimu pada modul energi di persenjataanmu.)

m.energy_info_3b = Energi digunakan untuk berbagai hal! Energi merupakan mata uang utama untuk \
	membeli barang dari Depot Perbekalan, memungkinkanmu membeli peningkatan untuk dirimu sendiri, \
	menghidupkanmu kembali di Clockworks saat Sparks of Life-mu habis, dan diperlukan untuk \
	membentuk sebuah guild. \n\
	\n\
	Kamu juga akan menemukan berbagai perangkat di dunia ini yang menggunakan energi sebagai \
	sumber dayanya. Cari saja simbol energi berwarna biru pada perangkat tersebut.

m.energy_info_3c = Energi hanya bisa diperoleh dengan membelinya menggunakan uang sungguhan atau \
	melalui perdagangan di Penukaran. Untuk membeli atau menukar energi, buka Depot Perbekalan, lalu \
	klik tombol 'Dapatkan Energy'.

r.energy_info_3a = Aku punya pertanyaan lain.

r.energy_info_3b = Pelajaranmu membuatku bersemangat! Aku pergi bertualang dulu, sampai jumpa!



## TUTORIAL

# Rescue Agent
#...................................................................................................

n.tut_intro = Agen Penyelamat

m.tut_intro_1a = Selamat datang di Cradle, rekrutan! Senang melihat seorang Knight selamat \
  mendarat tanpa cedera. Ada Kamp Penyelamatan tidak jauh dari posisimu. Akan kutunjukkan jalan \
  ke sana—tetapi siapkan pedangmu, ada musuh di jalan di depan!\n\

r.tut_intro_1a = Siap, aku segera ke sana!

n.tut_intro2 = Rhendon

m.tut_intro2_1a = ...masuk, {0}, kau di sana? Ini Knight Pengintai Rhendon!

r.tut_intro2_1a = Aku di sini, ada apa?

m.tut_intro2_2a = Kau baru saja mendarat di permukaan Cradle. Pod pelarianku jatuh tepat di sebelah utara \
	posisimu. Kita harus bertemu dan mencari titik kumpul terdekat. \n\
	\n\
	Berhati-hatilah dan siapkan pedangmu, makhluk-makhluk bermusuhan ada di mana-mana!

r.tut_intro2_2a = Siap, Rhendon. Aku menuju ke tempatmu!

n.tut_intro3 = Rhendon

m.tut_intro3_1a = {0}! Senang sekali melihatmu! Tempat ini begitu asing. Aku lega bisa melihat \
	wajah yang kukenal, bukan makhluk bermusuhan lagi.

r.tut_intro3_1a = Aku juga senang melihatmu selamat, Rhendon. Di mana para penyintas lainnya?

m.tut_intro3_2a = Aku sudah menjalin komunikasi dengan para Knight yang membentuk Kamp Penyelamatan \
	di depan. Jika kau menuju utara, pada akhirnya kau akan sampai di sana. \n\
	\n\
	Untuk sementara, aku akan tetap di sini dan mencari Knight lain yang jatuh di daerah ini. \
	Aku akan menemuimu di Kamp Penyelamatan sebelum matahari terbenam. \n\
	\n\
	Jika kau menghadapi sesuatu yang benar-benar berbahaya, tekan [[?DEFEND]] untuk menggunakan perisaimu!

r.tut_intro3_2a = Kalau begitu, aku akan mengintai jalan di depan! Hati-hati, Rhendon.

n.tut_intro4 = Rhendon
m.tut_intro4_1a = Untuk sementara, aku akan tetap di sini dan mencari Knight lain yang jatuh \
	di daerah ini. Aku akan menemuimu di Kamp Penyelamatan di sebelah utara. \n\
	\n\
	Jika kau menghadapi sesuatu yang benar-benar berbahaya, tekan [[?DEFEND]] untuk menggunakan perisaimu!

r.tut_intro4_1a = Kalau begitu, aku akan mengintai jalan di depan! Hati-hati, Rhendon.

m.tut_intro3_3a = Semoga berhasil!
m.tut_intro3_3b = Hati-hati!
m.tut_intro3_3c = Ingat, tekan [[?DEFEND]] untuk menggunakan perisaimu!

# Warden Companion
#.................................................................................................
n.tut_warden = Penjaga Spiral
m.tut_warden_1a = Salam, Knight. Kau pasti {0}. Rhendon menghubungi kami melalui radio dan \
	mengatakan kau sedang menuju ke sini. Ikutlah bersama kami, Kamp Penyelamatan sudah dekat.

r.tut_warden_1a = Bagus, aku sudah tidak sabar menikmati hidangan hangat.

m.tut_warden_2a = Aku juga. Sekarang, mari kita- \n\
	\n\
	Tunggu, ada yang tidak beres. Bersiaplah, sepertinya ada sesuatu yang mendekat!

r.tut_warden_2a = Akhiri percakapan

m.tut_warden_3a = Bagus sekali, {0}! Sepertinya kau sudah tahu cara bertarung di medan perang. \n\
	\n\
	Ayo, kita menuju kamp. Mungkin kau bisa membantu kami mencari tahu apa sebenarnya yang \
	sedang terjadi di sini.

r.tut_warden_3a = Akhiri percakapan

# Final Test Knight
#...................................................................................................

n.final_test_knight = Feron

m.final_test_knight_1a = Luar biasa! Tak pernah kusangka seorang rekrutan baru bisa keluar hidup-hidup \
	dari reruntuhan yang terbakar itu! Kau benar-benar luar biasa... \n\
	\n\
	Namaku Feron, Letnan dari Ordo Spiral. Kami mengira seluruh kompleks ini sudah terbengkalai \
	sampai lift yang menuju ke sini tiba-tiba aktif kembali. Saat kami menyelidikinya, seluruh \
	tempat ini mendadak terbakar! \n\
	\n\
	Bagaimana kau bisa sampai di sini?

r.final_test_knight_1a = (Ceritakan kepada Feron tentang Kamp Penyelamatan, Razwog, dan Artifak)

m.final_test_knight_2a = Begitu rupanya. Ini akan menjadi informasi yang sangat menarik bagi Markas Besar \
	Spiral. Kamp utama kami di Haven berada tepat di depan. Naiklah dengan lift dan temui para Knight lain \
	yang selamat dari kecelakaan sepertimu. Para teknisi di Lab pasti ingin mempelajari Artifak itu. \
	Mereka akan menanganinya setelah kau tiba di Haven. \n\
	\n\
	Jangan khawatir tentang orang-orang lain di Kamp Penyelamatan. Berkat dirimu, sistem lift kini \
	berfungsi sehingga kami bisa menjangkau mereka. Kau telah menyelamatkan mereka semua!

r.final_test_knight_2a = Terima kasih, Letnan. Aku akan menuju Haven.

# Rescued Stranger
#...................................................................................................

n.rescued_stranger = Keepoh
m.rescued_stranger_1a = Halo, anak muda. Di dunia baru ini, kau akan menemukan banyak bahaya, \
	tetapi juga banyak kesempatan bagi mereka yang berani dan gemar bertualang! Seorang kawanmu \
	sedang menunggumu di ujung jalan. Kita pasti akan bertemu lagi. Sampai jumpa untuk sekarang!
r.rescued_stranger_1a = Akhiri percakapan


## RESCUE CAMP KNIGHTS

# Greta B
#...................................................................................................

n.rc_greet2 = Greta
m.rc_greet2_1a = Salam, aku Pemimpin Regu Greta. Kau pasti {0}. Rhendon bilang kami harus \
	menunggumu, dan kau datang tepat pada waktunya. Kamp Penyelamatan ini sedang menghadapi krisis.

r.rc_greet2_1a = Apa masalahnya, Greta?

m.rc_greet2_2a = Singkatnya, kamp ini tidak memiliki daya dan matahari akan segera terbenam. Tadi malam, segala \
	macam monster mengerikan menyerang kami dalam kegelapan. Kami tidak bisa melihat apa-apa dan menara \
	pertahanan kami tidak memiliki daya. \n\
	\n\
	...banyak rekrutan kami yang gugur. \n\
	\n\
	Kita harus menyalurkan daya ke Kamp Penyelamatan agar kita bisa membangun perimeter pertahanan \
	sebelum malam tiba!

r.rc_greet2_2a = Bagaimana aku bisa membantu menyalurkan daya ke kamp?

m.rc_greet2_3a = Pemindaian kami menemukan sebuah generator kuno di bawah kamp ini. Seharusnya generator itu \
	menyalurkan daya ke permukaan, tetapi sepertinya ada sesuatu yang mengalihkan alirannya. \n\
	\n\
	Kami membutuhkanmu untuk menyelidiki generator kuno itu dan mengalihkan aliran daya kembali ke permukaan. \
	Namun, kau harus bersiap-siap—wilayah itu sama sekali belum dipetakan dan dipenuhi monster. \n\
	\n\
	Rhendon bilang dia ingin bertemu denganmu sebelum kau menjalankan misi ini. Bagaimana kalau kau \
	menemuinya terlebih dahulu?

r.rc_greet2_3a = Aku akan menemui Rhendon sebelum menyelidiki generator itu.

m.rc_greet2_4a = Kumohon, {0}, bantu kami memulihkan daya di Kamp Penyelamatan agar kami bisa membangun \
	perimeter pertahanan. Kita tidak boleh kehilangan rekrutan lagi akibat makhluk-makhluk malam!

r.rc_greet2_4a = Aku akan berusaha sebaik mungkin!

m.rc_greet3_1a = Kau telah memulihkan daya dan menyelamatkan kami semua, {0}! Aku tidak tahu bagaimana harus \
	berterima kasih kepadamu. Semua rekrutan ini berutang nyawa kepadamu. \n\
	\n\
	Sekarang, cobalah menghubungi Markas Besar Spiral melalui perangkat komunikasimu.

r.rc_greet3_1a = Akhiri percakapan

# Rescue Camp Recruit Knights
#...................................................................................................
n.rc_recruit = Rekrutan
m.rc_recruit_a = Meskipun kami tidak punya daya, setidaknya aku masih bisa menyalakan api agar \
	kita mendapat sedikit penerangan malam ini.

m.rc_recruit_b = Tidak banyak perlengkapan yang berhasil diselamatkan dari kapsul-kapsul penyelamat. \
	Bahkan, perlengkapan yang ada di sini tidak cukup untuk setiap Knight yang masih sanggup bertarung.

m.rc_recruit_c = Kau percaya tidak? Seluruh jurang ini dipenuhi mesin raksasa entah apa. \
	Sepertinya mesin ini terus berlanjut ke bawah tanpa akhir. \n\
	\n\
	Aku penasaran, apa seluruh planet ini juga seperti ini?

m.rc_recruit_d = Dengan hangatnya api unggun dan perlindungan dari menara-menara pertahanan, kurasa \
	aku bisa tidur nyenyak malam ini.

m.rc_recruit_e = Aku bisa merasakan aliran listrik di udara! Sepertinya malam ini kita tidak jadi \
	bertarung sampai titik darah penghabisan!

m.rc_recruit_f = Katanya kau akan turun menggunakan lift ini menuju jurang di bawah sana. \
	Kau jauh lebih berani dariku...

r.rc_recruit = Akhiri percakapan

# Technician Knight
#...................................................................................................
n.rc_technician = Teknisi
m.rc_technician_a = Menurut hasil pemindaian ini, seharusnya ada semacam sumber daya di \
	kedalaman bawah kamp, tetapi entah bagaimana aliran dayanya dialihkan...

m.rc_technician_b = Benda ini tidak berguna tanpa daya. Bagaimana kita bisa melindungi diri \
	dari monster-monster itu?!

m.rc_technician_c = Daya kembali mengalir deras ke kamp! Kau berhasil, {0}!

r.rc_technician = Akhiri percakapan

# Injured Knight
#...................................................................................................
n.rc_injured = Knight yang Terluka
m.rc_injured_a = Tadi malam, monster-monster mengerikan menyerang kami dalam kegelapan. Situasinya benar-benar kacau. \
	Tanpa daya untuk menyalakan menara pertahanan, kami tidak bisa melindungi diri. \n\
	\n\
	Begitu banyak Knight pemberani yang gugur...

m.rc_injured_b = Salah satu monster mekanis itu berhasil menangkapku. Cakar benda terkutuk itu merobek \
	zirahku hingga tembus!

m.rc_injured_c = Berkat dirimu, kita tidak perlu menghadapi malam mengerikan seperti malam sebelumnya lagi...

m.rc_injured_d = Setelah daya pulih, aku bisa memperbaiki zirahku. \
	Semoga saja aku tidak bertemu terlalu banyak \
	bangkai besi berkarat mengerikan itu lagi!

r.rc_injured = Akhiri percakapan


# Nervous Knight
#...................................................................................................

n.rc_nervous = Knight yang Gugup

m.rc_nervous_1a = Aku ingin membeli sesuatu dengan Crown yang kudapatkan di tempat latihan, tetapi \
	merchant itu benar-benar membuatku merinding. Menurutmu, apa yang disembunyikannya di balik \
	jubah itu?!

r.rc_nervous_1a = Akhiri percakapan

# Forge Knight
#...................................................................................................
n.rc_forge = Knight Pandai Besi
m.forge_knight_1a = Cradle adalah dunia yang berbahaya, dan penting untuk memastikan bahwa kau memiliki \
	perlengkapan yang kuat dalam persenjataanmu agar bisa bertahan hidup. Untuk itu, kau perlu menggunakan Pandai Besi.

r.forge_knight_1a = Apa itu Pandai Besi?

m.forge_knight_2a = Pandai Besi menggunakan panas yang tersimpan dalam perlengkapanmu dan menggabungkannya dengan kekuatan \
	Kristal Api untuk membuka potensi baru perlengkapan tersebut.

r.forge_knight_2a = Lanjutkan

m.forge_knight_3a = Di kota, kau bisa mengakses Pandai Besi kapan saja. Di Clockworks, kau bisa \
	mengaksesnya dengan menggunakan Stasiun Persenjataan.

r.forge_knight_3a = Lanjutkan

m.forge_knight_4a = Saat menggunakan Pandai Besi, kau akan melihat daftar barang yang siap naik \
	level. Memilih suatu barang akan menunjukkan bagaimana barang tersebut bisa ditingkatkan.

r.forge_knight_4a = Lanjutkan

m.forge_knight_5a = Setiap barang membutuhkan jenis Kristal Api tertentu. Kristal Api bisa \
	diperoleh dari Depot Perbekalan, sebagai hadiah setelah menyelesaikan misi tertentu, dan ditemukan di blok harta karun \
	di Clockworks!

r.forge_knight_5a = Bagaimana cara kerja Kristal Api?

m.forge_knight_6a = Kristal Api agak tidak stabil, sehingga jumlah yang dibutuhkan agar proses \
	penempaan berhasil bisa bervariasi. \n\
	Selain itu, kami menemukan bahwa menambahkan lebih banyak Kristal Api meningkatkan peluang \
	mendapatkan bonus khusus yang akan diterapkan pada barang tersebut! \n\

r.forge_knight_6a = Kedengarannya hebat!

m.forge_knight_7a = Sekarang setelah kau mengetahui tentang Pandai Besi, apakah kau ingin melihatnya?

r.forge_knight_7a = Tentu! (Buka Pandai Besi)
r.forge_knight_7b = Nanti saja. (Akhiri percakapan)

# Geo Knight
#...................................................................................................

n.rc_soil = Knight Geologi

m.rc_soil_1a = Aku sedang mengumpulkan sampel geologi untuk Markas Besar Spiral. Sejauh ini, hasil \
	pengujianku menunjukkan adanya ratusan sampel tanah unik di setiap jengkal tanah di bawah kaki kita. Ini \
	tidak mungkin, pasti ada kesalahan dalam perhitunganku...

r.rc_soil_1a = Akhiri percakapan

# Veteran Knights
#...................................................................................................
n.rc_vet_1 = Penjaga Spiral
n.rc_vet_2 = Knight Veteran

m.rc_vet_1a = Terima kasih atas bantuanmu tadi. Jaga diri!
m.rc_vet_2a = Selalu waspada. Siapa yang tahu bahaya lain apa yang menanti kita di dunia ini?
m.rc_vet_3a = Aku tidak akan bisa tenang sampai kita berhasil terhubung dengan Spiral HQ.

r.rc_vet_1a = Akhiri percakapan

# Rhendon
#...................................................................................................
n.rc_rhendon = Rhendon

m.rc_rhendon_1a = Menurutmu benda ini sebenarnya apa, {0}? Pasti penting kalau si \
  Razwog itu sampai begitu murka saat kamu merebutnya. \n\
  \n\
  Rasakan akibatnya sendiri karena sudah mencoba membunuhmu!

r.rc_rhendon_1a = Akhiri percakapan

# Kinter
#...................................................................................................

n.rc_instruct = Kinter

m.rc_instruct_1a = Salam, rekrutan. Selalu menyenangkan melihat Knight lain berhasil mencapai Kamp Penyelamatan. \
	Saya rasa kamu ingin mempersiapkan diri untuk perjalananmu ke Haven. Tempat yang bagus untuk memulai adalah \
	gerbang di sini menuju Clockworks. Cukup dekati panel kontrol di ujung utara \
  lift dan tekan tombol aksi ([[?ACTION]]).\n\
  \n\
  Ada pertanyaan?

r.rc_instruct_1a = Tentu saja ada!

r.rc_instruct_1b = Tidak ada pertanyaan, langsung bertindak saja. Aku pergi sekarang.

m.rc_instruct_2a = Apa yang ingin kamu ketahui?

r.rc_instruct_2a = "Clockworks"?

r.rc_instruct_2b = Kamu tadi mengatakan sesuatu tentang "gerbang"?

r.rc_instruct_2c = Setelah kupikir-pikir, aku akan pergi sekarang.


m.rc_instruct_3a = Clockworks adalah kompleks besar berisi roda gigi dan mesin yang terletak \
  tepat di bawah permukaan seluruh dunia ini. Pemandangannya sungguh luar biasa. Ini \
  adalah dunia yang aneh dan berbahaya, tempat kita berada sekarang. Berhati-hatilah.

m.rc_instruct_3b = "Gerbang" adalah titik masuk menuju Clockworks. Bentuknya seperti \
  lift yang kamu lihat di hadapanmu. Setiap gerbang memiliki monitor yang menampilkan \
  ikon unik gerbang tersebut serta panel kontrol yang memungkinkan pengguna memasuki gerbang. Gerbang \
  di sini akan selalu membawamu ke tempat yang sama, tetapi gerbang lain memiliki lantai yang berubah-ubah di bawahnya. \
  Di gerbang-gerbang itu, kamu tidak akan pernah benar-benar tahu apa yang menantimu!


r.rc_instruct_3a = Aku punya pertanyaan lain.

r.rc_instruct_3b = Terima kasih atas informasinya, aku pergi sekarang.


# Boomer
#...................................................................................................

n.rc_bomb = Boomer

m.rc_bomb_1a = Sudah sempat mencoba bom? Tidak seperti jenis senjata lainnya, bom hanya bisa \
  digunakan sebagai serangan bermuatan. Melakukan hal lain hanya akan membuatnya gagal meledak. Namun, jika kamu \
  mengisi dayanya... DUAR! Bom bisa memberikan damage besar kepada beberapa monster sekaligus!

r.rc_bomb_1a = Kedengarannya seru! Mungkin aku akan membeli beberapa dari pedagang keliling.


# Cautious Knight
#...................................................................................................

n.rc_warning = Knight yang Waspada

m.rc_warning_1a = Di atas tangga ini terdapat gerbang menuju Haven. Pastikan kamu berbicara dengan Virgil \
  sebelum masuk agar kamu tahu apa yang harus diharapkan.

r.rc_warning_1a = Aku mengerti, aku akan mendengarkan apa yang dikatakan Virgil.


# Sleepy Knight
#...................................................................................................

n.rc_sleepy = Knight yang Mengantuk

m.rc_sleepy_1a = Berlatih... berat sekali... hanya perlu istirahat.... mataku...

r.rc_sleepy_1a = Akhiri percakapan


# Virgil
#...................................................................................................

n.rc_end = Virgil

m.rc_virgil_1a = Berhati-hatilah di depan.

r.rc_virgil_1a = Kenapa?

m.rc_virgil_2a = Jalan setapak ini membentang tepat di atas jurang yang sangat dalam. Aku tidak ingin kamu \
	tertiup angin hingga jatuh ke dalam kegelapan di bawah sana.

r.rc_virgil_2a = Kalau begitu, untuk apa jalan setapak ini ada?

m.rc_virgil_3a = Sepertinya jalan ini menuju ke semacam lift, tetapi tanpa daya, seluruh \
	lift itu tidak berfungsi.

r.rc_virgil_3a = Aku akan berhati-hati.

m.rc_virgil_4a = Salam, {0}. Saat kamu memulihkan daya ke kamp, lift ini juga kembali berfungsi. \
  Kurasa lift ini akan membawamu jauh ke dasar jurang di bawah sana, dan hanya Tuhan yang tahu apa yang akan kamu temukan \
  di sana. \n\
  \n\
  Jika tujuanmu adalah menjelajahi kedalaman itu, pastikan kamu siap menghadapi apa pun \
  yang menantimu di sana.

r.rc_virgil_4a = Akhiri percakapan

m.rc_end_1a = Inilah saatnya, rekrutan. Ini adalah gerbang terakhir yang akan membawamu keluar dari Kamp Penyelamatan, \
  melewati jurang dan menuju Haven. Setelah melewatinya, kamu tidak perlu kembali ke sini lagi. \
  Kamu bisa membeli semua barang yang tersedia di Kamp Penyelamatan dan masih banyak lagi di Haven. \n\
  \n\
  Ada pertanyaan?

r.rc_end_1a = Ya, aku ingin menanyakan beberapa hal.

r.rc_end_1b = Aku mengerti sepenuhnya, tidak ada pertanyaan.

m.rc_end_2a = Apa yang bisa kubantu?

r.rc_end_2a = Setelah berhasil sampai di Haven, aku benar-benar tidak bisa kembali?

r.rc_end_2b = Tantangan seperti apa yang menantiku di gerbang terakhir?

r.rc_end_2c = Apa yang harus kulakukan setelah mencapai Haven?

r.rc_end_2d = Tidak ada pertanyaan lagi, aku akan pergi.

m.rc_end_3a = Benar, kamu tidak akan bisa kembali. Setelah mencapai Haven, pelatihanmu selesai \
  dan tujuan barumu adalah membantu para Spiral Knight yang kini bermarkas di Haven.

m.rc_end_3b = Meskipun jalurnya berbahaya, kamu tidak akan menjelajah terlalu dalam, jadi monster \
