#n.och_leader_1 = Feron
m.och_leader_1_1a = Senang bertemu denganmu, {0}! Syukurlah Markas Besar Spiral mengirimkan bala bantuan, dan \
	waktunya benar-benar tepat! Kami sudah terdesak dan membutuhkan bantuanmu!
r.och_leader_1_1a = Bagaimana saya bisa membantu, Letnan?
m.och_leader_1_2a = Gerak maju kami terhenti akibat artileri di atas tembok yang terus menekan kami. \
	Sebelumnya, kami melancarkan pengalihan untuk memungkinkan satu regu kecil Knight menerobos \
	garis depan dan membungkam artileri itu... tetapi sepertinya mereka gagal. Sekarang mereka \
	terjebak di dalam sana, sementara kami tertahan di luar! \n\
	\n\
	Aku membutuhkanmu untuk menerobos garis depan, masuk ke pusat kendali artileri, dan \
	menemukan cara untuk menghancurkan meriam-meriam itu selamanya! Sementara itu, aku akan menata ulang \
	pasukan agar kami bisa menyusul setelah seranganmu. Semoga berhasil di sana, prajurit!
r.och_leader_1_2a = Saya tidak akan mengecewakanmu, Letnan.

n.och_leader_2 = Feron
m.och_leader_2_1a = Bagus sekali, {0}! Pertunjukan kembang api itu sungguh luar biasa! Berkat dirimu, kami berhasil \
	membersihkan zona pendaratan terkutuk itu dan memindahkan pangkalan operasi kami ke dekat gerbang bagian dalam!
r.och_leader_2_1a = Apa langkah selanjutnya, Letnan?
m.och_leader_2_2a = Gerbang-gerbang besar itu menghalangi jalan kita, dan menurut laporan intelijen, satu-satunya cara \
	untuk membukanya adalah dari dalam dua rumah gerbang yang bersebelahan. Aku tidak akan mengorbankan nyawa \
	sia-sia dengan menyerbu rumah gerbang dari depan. Aku membutuhkanmu untuk mencari jalan memutar. Kepung \
	pertahanan mereka dari samping, masuk ke rumah gerbang, dan buka gerbang-gerbang itu!
r.och_leader_2_2a = Anggap saja gerbang-gerbang itu sudah terbuka, Letnan!

