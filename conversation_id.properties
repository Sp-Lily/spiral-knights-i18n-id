r.sprite_tut_5b = Lanjutkan

m.sprite_tut_6b = Setelah kamu menerapkan semua poin keahlian dan mencapai level yang sangat tinggi dengan \
	Spritemu, kamu akan mulai memilih 'keahlian pamungkas'. Keahlian pamungkas adalah versi yang lebih kuat dari \
	keahlian Sprite-mu. Setiap keahlian Sprite memiliki dua pilihan keahlian pamungkas.

r.sprite_tut_6b = Lanjutkan

