	Lihatlah, mesin alkimia di hadapanmu ini dapat membuat trofi monster yang megah untuk \
	Aula Guild-mu. \n\
	\n\
	Mesin alkimia ini menggunakan bahan dan Crown dari Perbendaharaan Guild-mu, lalu menyimpan \
	hasilnya kembali ke Perbendaharaan Guild.

