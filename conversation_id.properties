# Arcade Leader
#...................................................................................................

n.arc_leader = Feron

m.arc_leader_1 = Salam, prajurit, dan kerja bagus karena berhasil mencapai kamp pangkalan kita di Haven. Aku \
  Letnan Feron. Kapten Ozlo menugaskanku untuk mengawasi operasi penambangan Clockworks kita.\n\
  \n\
  Di hadapanmu terdapat "Arkade", kompleks menakjubkan yang menjadi penghubung kita menuju jantung \
  Clockworks. Karena kamu masih baru di sini, aku akan menjelaskan secara singkat apa yang ditugaskan Markas Besar \
  Spiral kepada kita di tempat ini.

r.arc_leader_1 = Kedengarannya penting, ceritakan bagaimana semuanya bekerja.

m.arc_leader_2 = Setelah Skylark jatuh, inti tearium utamanya meledak, menghancurkan \
  sebagian kapal dan membuatnya kehilangan sumber daya utamanya. Sejauh ini, kita belum \
  menemukan beberapa ratus ton tearium yang tergeletak begitu saja, jadi kapal itu pada dasarnya \
  telah kehilangan sayapnya.\n\
  \n\
  Dengan bantuan para Strangers, kita berhasil mendirikan pangkalan operasi kecil di \
  Haven. Setelah sistem kita aktif, kita menemukan bahwa di dalam jantung batu ini \
  terdapat pancaran energi dengan kekuatan yang belum pernah terjadi sebelumnya.

r.arc_leader_2 = Kalau saja kita bisa memanfaatkan energi itu...

m.arc_leader_3 = Tepat sekali! Inti Clockworks mungkin menyimpan sumber energi yang kita butuhkan \
  untuk menciptakan sumber daya baru bagi Skylark dan memulihkannya agar dapat beroperasi kembali. Hanya ada satu masalah- \
  Clockworks itu sendiri tampaknya dibangun seperti perangkap maut yang gila.\n\
  \n\
  Mencapai Inti tidak akan mudah...

r.arc_leader_3 = Aku siap menjalankan tugas!

m.arc_leader_4 = Aku suka semangat seperti itu. Begini cara kerjanya: kamu menggunakan gerbang-gerbang \
  di depan untuk menjelajahi Clockworks dan mengambil mineral khusus. Kemudian, kamu memasukkan kembali mineral-mineral itu \
  ke dalam gerbang untuk mengubah Clockworks di bawah, menciptakan level-level baru yang belum dijelajahi.\n\
  \n\
  Kami yakin mineral-mineral itu adalah kunci untuk membuka jalan menuju Inti. Kita hanya perlu \
  menemukan cara menggunakannya!

r.arc_leader_4 = Aku memahami misiku.

m.arc_leader_5 = Kamu telah membuktikan bahwa kamu siap bertempur, dan aku yakin kamu akan mengabdi \
  kepada Ordo Spiral dengan gagah berani. Gerbang menuju Clockworks berada tepat di depan. \n\
  \n\
  Semoga berhasil!

r.arc_leader_5 = Akhiri percakapan
r.arc_leader_5_accept = Mencapai Terminal 1? Aku segera melakukannya!


