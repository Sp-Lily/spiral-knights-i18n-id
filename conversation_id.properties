m.emberlight_visitor_4a = Emberlight didirikan oleh para gremlin buangan dari Koloni Besar. Gremlin Emberlight \
	tidak mematuhi Hukum Besi, jadi mereka harus melarikan diri atau mati. Kami memulai hidup baru di Emberlight. Koloni baru ini \
	menjadi rumah bagi sebagian kecil dari kami: kebanyakan mantan perancang skema, beberapa pedagang, beberapa petarung, semuanya pengkhianat di mata \
	para gremlin Koloni Besar.

r.emberlight_visitor_4a = Satu pertanyaan lagi, Pakrat.

m.emberlight_visitor_4b = Tidak ada yang tahu pasti. Tinkinzar tidak terlihat selama bertahun-tahun. Ordo Crimson \
	melaksanakan rencana Tinkinzar untuk Cradle. Emberlight menjadi penghalang bagi rencana besar itu \
	karena didirikan oleh para buangan. Haven mungkin juga begitu, didirikan oleh mereka yang bukan gremlin. Bukan bagian dari rencana!

# Vanaduke
m.lab_progress_9 = Perangkat aneh lainnya! Perangkat ini jelas bukan dibuat oleh bangsa Almirian, sama seperti \
	perangkat sebelumnya bukan dibuat oleh para jeli. Namun, ada satu hal yang kami perhatikan: perangkat ini \
	masih aktif. Selain itu, tanda energi yang dipancarkannya mirip dengan hasil pembacaan \
	yang kami dapatkan dari Artefak sebelum dicuri. Kurasa ini memerlukan penelitian lebih lanjut.

m.almire_historian_1a = Kami telah memulihkan sedikit sisa catatan dari Benteng Owlite mengenai Kerajaan \
	Almire. Digabungkan dengan potongan informasi yang kami peroleh dari Sprite alam di dalam Benteng \
	Badai Api itu sendiri, kami mulai mendapatkan gambaran yang lebih jelas tentang sejarah Almire.

r.almire_historian_1a = Apa yang telah kalian pelajari tentang Almire?

m.almire_historian_2a = Dari kitab-kitab yang berhasil kami pulihkan, kami mengetahui bahwa Benteng Badai Api \
	pernah menjadi bagian dari kerajaan yang jauh lebih besar bernama Almire ribuan tahun yang lalu. Meskipun \
	berbatasan dengan negara-negara lain yang agresif, Almire terkenal karena \
	kehebatan tempur banyak legiunnya. Legiun-legiun ini menjaga kerajaan tetap aman selama bertahun-tahun. Sayangnya, \
	jumlah mereka tidak cukup.

r.almire_historian_2a = Apa yang terjadi pada bagian kerajaan lainnya?

m.almire_historian_3a = Nah, sekarang kita tahu bahwa ada benteng-benteng besar yang menampung angkatan bersenjata \
	Almire serta tanah milik luas untuk keluarga bangsawannya. Pemandangannya pasti sangat menakjubkan. \
	Kami menduga sisa kerajaan itu masih berupa reruntuhan yang membara di suatu tempat. Ada kemungkinan \
	sebagian wilayahnya masih bertahan... meskipun berdasarkan bukti dari cerita-cerita yang kami dengar, kemungkinan itu \
	sangat kecil.

