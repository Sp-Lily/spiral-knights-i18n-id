m.core_tech_3 = Udara segar? Kehangatan? Kedalaman ini bukan lingkungan yang bisa kami tahan \
	lebih lama lagi, tetapi Letnan bersikeras agar kami terus bekerja, berharap lonjakan daya dari \
	gerbang berikutnya akan memberi kami jawaban yang dibutuhkan. \n\
	\n\
	Kamu tentu tidak bisa menyangkal bahwa Letnan kami sangat berdedikasi. Kurasa aku belum pernah melihat \
	dia memejamkan mata, apalagi tidur.

